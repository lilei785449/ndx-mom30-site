name: Update NDX MOM30

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/update_mom30.py"
      - ".github/workflows/update-mom30.yml"
  schedule:
    # 美股收盘后运行；23:30 UTC = 夏令时纽约 19:30 / 冬令时 18:30
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ndx-mom30
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" requests openpyxl "yfinance>=0.2.54,<1"

      - name: Build current NDX MOM30 ranking
        run: python scripts/update_mom30.py

      - name: Validate public output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/ndx_mom30_latest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data.get("status") == "ready"
          assert len(data.get("top30", [])) == 30
          assert data.get("ndx", {}).get("constituent_count", 0) >= 80
          print("Public MOM30 output validated.")
          PY

      - name: Commit refreshed public data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ndx_mom30_latest.json data/ndx_mom30_history.csv data/ndx_mom30_state.json data/ndx_mom30_top30.csv data/ndx_mom30_all.csv
          if git diff --cached --quiet; then
            echo "No MOM30 data changes to commit."
            exit 0
          fi
          git commit -m "Update NDX MOM30 ranking"
          git push
